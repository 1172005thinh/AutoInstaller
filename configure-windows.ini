# CONFIGURE-WINDOWS
## WINDOWS POST-INSTALLATION CONFIGURATION
### SECTION TOGGLES
## Set any flag to false to skip that configuration section entirely.
config=[
    # key, enabled
    # 1. Windows Explorer defaults (LaunchTo=This PC, show file extensions)
    "explorer",                 true;
    # 2. Taskbar (hide search, Copilot, Widgets; unpin defaults; pin apps)
    "taskbar",                  true;
    # 3. Desktop icons (add This PC, User Files, Recycle Bin, Control Panel, Network; sort by type)
    "desktop",                  true;
    # 4. System settings (End Task, sudo inline, clipboard history, power timeouts, startup apps)
    "system",                   true;
    # 5. Start menu (More Pins layout, pin Settings folder, hide recommendations)
    "start_menu",               true;
    # 6. Control Panel (large icons view)
    "control_panel",            true;
    # 7. Region format (Vietnamese vi-VN: date, time, number formats)
    "region",                   true;
    # 8. Wallpaper (Light theme wallpaper)
    "wallpaper",                true;
];
### CONFIGURATION
## log_path: path to the log file (used by configure-windows.ps1)
log_path=C:/Auto-installer/configure-windows.log;
# END
