# CONFIGURE-WINDOWS CONFIGURATION FILE
# ==============================================================================
# Windows Post-Installation Configuration
# All actions are executed by configure-windows.ps1 and logged to log_path.
# ==============================================================================

[general]
# Path to the log file
log_path=C:/Auto-installer/configure-windows.log;

[explorer]
# 1. File Explorer hidden items
# Options: "HideAll" (Hide Hidden & System items) | "HideHidden" | "Show"
hidden_items=HideAll;

# 2. File Explorer show file extensions
# Options: true (show extensions) | false (hide extensions)
show_extensions=true;

# 3. Open File Explorer to
# Options: "ThisPC" | "QuickAccess" | "Downloads"
launch_to=ThisPC;

[taskbar]
# 4. Show "End task" command in the taskbar context menu
# Options: true | false
end_task=true;

# 5. Taskbar search box
# Options: "Hide" | "Icon" | "Full" | "IconAndLabel"
search_mode=Hide;

# 6. Remove default taskbar pins
# [BUG PARTIALLY WORKING]
# Options: true | false
unpin_defaults=true;

# 7. Taskbar pins to add (comma-delimited list of app shortcuts or paths)
# [BUG NOT APLLIED YET]
# Supported app shortcuts: explorer, chrome, word, excel, powerpoint, outlook, onenote, notepadpp, vscode, zalo, powershell, settings
# Custom .lnk or .exe paths are also accepted.
pins=explorer, chrome, word, excel, powerpoint, zalo;

# 8. Taskbar widgets (News and Interests)
# Options: true (enabled) | false (disabled)
widgets=false;

# 9. Taskbar alignment
# Options: "Left" | "Center"
alignment=Left;

# 10. Taskview button
# Options: "Show" | "Hide"
taskview=Hide;

[start_menu]
# 11. Do not show Bing search results in Start Menu / Windows Search
# Options: true (disable Bing results) | false (enable Bing results)
disable_bing_search=true;

# 12. Remove all default Start Menu pinned apps
# [BUG NOT APLLIED YET]
# Options: true | false
remove_default_pins=true;

# 13. Start Menu pins to add (comma-delimited list of app keys or paths)
# Supported app shortcuts: edge, explorer, settings, chrome, notepadpp, word, excel, powerpoint
pins=edge, explorer, settings, chrome, notepadpp;

# 22. Start Menu folder list beside power button (comma-delimited list or "None")
# Options: Settings, File Explorer, Documents, Downloads, Music, Pictures, Videos, Network, Personal Folder
folders=Settings, File Explorer, Downloads;

[system]
# 14. Disable Smart App Control
# Options: true (disabled) | false (default)
disable_smart_app_control=true;

# 15. Enable Win32 long paths (> 260 characters)
# Options: true | false
enable_long_paths=true;

# 16. Enable Remote Desktop (RDP) and firewall rule
# Options: true | false
enable_rdp=true;

# 17. Allow execution of PowerShell scripts (RemoteSigned)
# Options: true | false
allow_powershell_scripts=true;

# 18. Hide Microsoft Edge First Run Experience
# Options: true | false
hide_edge_first_run=true;

# 19. Delete empty C:\Windows.old folder if present
# Options: true | false
delete_windows_old=true;

# 23. Sticky keys shortcut popup (pressing Shift 5 times)
# Options: true (enabled) | false (disabled)
sticky_keys=false;

# 26. Sudo command mode (Windows 11 24H2+)
# Options: "Inline" | "NewWindow" | "DisableInput" | "Disable"
sudo_mode=Inline;

# 27. Clipboard history (Win+V)
# Options: true | false
clipboard_history=true;

[desktop]
# 20. Desktop icons to show (comma-delimited list or "None")
# Available options: This PC, Recycle Bin, Users Files, Network, Control Panel
icons=This PC, Recycle Bin, Users Files, Network, Control Panel;

# 21. Desktop icons sorting
# Options: "ItemType" | "Name" | "Size" | "DateModified" | "None"
sort=ItemType;

[control_panel]
# 28. Control Panel icons view mode
# Options: "Large" (Large icons) | "Small" (Small icons) | "Category" | "Skip" (do not configure)
view=Large;

[wallpaper]
# 24. Desktop wallpaper
# Options: "Default" | local file path (e.g. wallpaper.jpg) | image URL
desktop=wallpaper.png;

# 25. Lock screen wallpaper
# Options: "Default" | local file path (e.g. lockscreen.jpg) | image URL
lockscreen=wallpaper.png;

[region]
# 29. Region & Format settings
enabled=true;
locale=0000042A;
locale_name=vi-VN;
language=VIT;
country=Viet Nam;
country_code=84;
long_date=dddd, d MMMM, yyyy;
short_date=dd/MM/yyyy;
year_month=MMMM yyyy;
time_format=h:mm:ss tt;
short_time=h:mm tt;
first_day_of_week=0;
measure=0;
currency=₫;
decimal=,;
thousand=.;
digits=2;
geo_nation=251;
# END
