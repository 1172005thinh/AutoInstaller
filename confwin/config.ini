[Configuration]
mode=2

[explorer]
hidden_items=Show
show_extensions=true
launch_to=ThisPC

[taskbar]
alignment=Left
end_task=true
search_mode=Hide
widgets=false
taskview=Hide
unpin_defaults=true

[start_menu]
disable_bing_search=true
remove_default_pins=true
folders=Settings, File Explorer, Downloads

[desktop]
icons=This PC, Recycle Bin, Control Panel
sort=ItemType

[control_panel]
view=Large

[system]
clipboard_history=true
sticky_keys=false
hide_edge_first_run=true
enable_long_paths=true
sudo_mode=Inline
allow_powershell_scripts=true
enable_rdp=true
disable_smart_app_control=true
delete_windows_old=true

[wallpaper]
desktop=Default
lockscreen=Default
